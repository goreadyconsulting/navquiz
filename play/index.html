<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0d061b">
  <title>NAVRANG • Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/navrang.css">
</head>
<body class="player-page">
  <div class="grain"></div><div class="rangoli-bg"></div>
  <main class="app-shell">
    <header class="topbar">
      <a class="logo" href="../">NAVRANG</a>
      <span id="connection" class="connection">CONNECTED</span>
    </header>

    <section id="joinView" class="player-main">
      <div class="join-card card fade-up">
        <p class="overline">JOIN THE CELEBRATION</p>
        <h1>NAVRANG</h1>
        <h2>Pick your colour.</h2>
        <p class="muted">Every answer counts for you and your team.</p>
        <div class="field">
          <label>GAME CODE</label>
          <input id="codeInput" maxlength="10" value="NAV26" autocomplete="off">
        </div>
        <div class="field">
          <label>YOUR NAME</label>
          <input id="nameInput" maxlength="32" placeholder="Enter your name" autocomplete="name">
        </div>
        <div class="field">
          <label>YOUR TEAM</label>
          <div id="teamGrid" class="team-grid">
            <button class="team-pick selected" data-team="Red" style="--team:#ff5b54"><i></i><span>Red</span></button>
            <button class="team-pick" data-team="Yellow" style="--team:#fee440"><i></i><span>Yellow</span></button>
            <button class="team-pick" data-team="Green" style="--team:#37d67a"><i></i><span>Green</span></button>
            <button class="team-pick" data-team="Blue" style="--team:#00bbf9"><i></i><span>Blue</span></button>
            <button class="team-pick" data-team="Purple" style="--team:#9b5de5"><i></i><span>Purple</span></button>
          </div>
        </div>
        <button id="joinBtn" class="btn btn-primary">JOIN NAVRANG <span>→</span></button>
        <div id="joinError" class="error"></div>
      </div>
    </section>

    <section id="gameView" class="player-main" hidden>
      <div style="width:100%">
        <div class="player-hud">
          <div class="hud-chip"><small>ROUND</small><b id="hudRound">WAITING</b></div>
          <div class="hud-chip score"><small>SCORE</small><b id="hudScore">0</b></div>
          <div class="hud-chip streak"><small>STREAK</small><b id="hudStreak">0 🔥</b></div>
        </div>
        <div id="playerStage" class="player-stage card"></div>
        <footer class="player-footer">
          <span id="playerName"></span>
          <span id="playerTeam"></span>
        </footer>
      </div>
    </section>
  </main>

  <script src="../assets/common.js"></script>
  <script src="./play.js"></script>
</body>
</html>
