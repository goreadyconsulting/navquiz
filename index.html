<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100622">
  <title>NAVRANG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/navrang.css">
</head>
<body class="home-page">
  <div class="grain"></div>
  <div class="rangoli-bg"></div>
  <main class="home-shell">
    <section class="home-copy">
      <div class="festive-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="overline">OFFICE NAVRATRI CELEBRATION</p>
      <h1>NAVRANG</h1>
      <p class="home-tagline">Nine colours. Nine rounds. One celebration.</p>
      <a class="btn btn-primary btn-large" href="./play/?code=NAV26">JOIN THE CELEBRATION <span>→</span></a>
      <p class="home-note">Bring your phone. Pick your colour. Play together.</p>
    </section>

    <section class="home-orbit" aria-hidden="true">
      <div class="mandala mandala-xl">
        <i style="--n:0;--c:#ff5b54"></i><i style="--n:1;--c:#ff9f43"></i><i style="--n:2;--c:#fee440"></i>
        <i style="--n:3;--c:#37d67a"></i><i style="--n:4;--c:#00c2a8"></i><i style="--n:5;--c:#00bbf9"></i>
        <i style="--n:6;--c:#6c63ff"></i><i style="--n:7;--c:#9b5de5"></i><i style="--n:8;--c:#f15bb5"></i>
        <div class="mandala-core"><small>નવરાત્રી</small><b>9</b><span>ROUNDS</span></div>
      </div>
    </section>

    <nav class="home-tools">
      <a href="./stage/?code=NAV26">Stage screen</a>
      <a href="./host/?code=NAV26">Host controls</a>
    </nav>
  </main>
  <script>
    document.querySelectorAll("a").forEach(function(a){
      a.addEventListener("pointerdown",function(){ document.body.classList.add("tap"); });
    });
  </script>
</body>
</html>
