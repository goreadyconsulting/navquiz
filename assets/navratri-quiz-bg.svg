  <rect x="139" y="-19" width="96" height="9" rx="5" transform="rotate(28 139 -19)" fill="#24cbbd"/>
</g>

<!-- right dancer silhouette -->
<g transform="translate(1270 445)" fill="#143f54" opacity=".86">
