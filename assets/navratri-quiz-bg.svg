  <path d="M70 48c-22 42-28 87-21 132c-50 35-82 84-92 145h223c-13-63-48-111-92-143c9-46 6-91-18-134z"/>
  <path d="M71 76L6 6l-19 17l64 88z"/>
  <path d="M93 72l67-61l18 19l-66 79z"/>
  <rect x="-18" y="-15" width="102" height="9" rx="5" transform="rotate(-32)" fill="#f15b9e"/>
  <rect x="137" y="-8" width="95" height="9" rx="5" transform="rotate(31 137 -8)" fill="#ffd84a"/>
</g>

<!-- distant dance crowd -->
<g fill="#5d245d" opacity=".32">
  <circle cx="360" cy="575" r="17"/><path d="M350 594l-30 105h78l-30-105z"/><path d="M353 610l-44-42l-12 12l47 55z"/>
  <circle cx="455" cy="560" r="16"/><path d="M447 578l-34 108h82l-31-108z"/><path d="M456 598l45-51l12 13l-43 57z"/>
  <circle cx="1145" cy="560" r="16"/><path d="M1137 578l-31 108h82l-34-108z"/><path d="M1144 598l-45-51l-12 13l43 57z"/>
  <circle cx="1240" cy="575" r="17"/><path d="M1232 594l-30 105h78l-30-105z"/><path d="M1238 610l44-42l12 12l-47 55z"/>
</g>

<!-- diya clusters -->
<g>
  <g transform="translate(80 742)">
    <ellipse cx="0" cy="48" rx="72" ry="22" fill="#8b3b18"/><path d="M-68 44Q0 88 68 44Q44 104 0 105Q-44 104-68 44Z" fill="#f39b22"/>
    <path d="M0 43c-14-22 2-37 0-54c23 22 22 41 0 54z" fill="#fff2a0"/>
  </g>
  <g transform="translate(1520 742)">
    <ellipse cx="0" cy="48" rx="72" ry="22" fill="#8b3b18"/><path d="M-68 44Q0 88 68 44Q44 104 0 105Q-44 104-68 44Z" fill="#f39b22"/>
    <path d="M0 43c-14-22 2-37 0-54c23 22 22 41 0 54z" fill="#fff2a0"/>
  </g>
</g>

<!-- petals -->
<g fill="#f15b9e" opacity=".72">
  <ellipse cx="270" cy="780" rx="12" ry="5" transform="rotate(18 270 780)"/>
  <ellipse cx="345" cy="825" rx="11" ry="5" transform="rotate(-24 345 825)"/>
  <ellipse cx="1260" cy="798" rx="12" ry="5" transform="rotate(28 1260 798)"/>
  <ellipse cx="1370" cy="840" rx="11" ry="5" transform="rotate(-18 1370 840)"/>
  <ellipse cx="660" cy="745" rx="10" ry="4" transform="rotate(35 660 745)"/>
  <ellipse cx="950" cy="755" rx="10" ry="4" transform="rotate(-35 950 755)"/>
