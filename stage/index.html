<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d061b">
  <title>NAVRANG • Stage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/navrang.css">
</head>
<body class="stage-page">
  <video class="ambient-video" autoplay muted loop playsinline><source src="../assets/navratri-intro.mp4" type="video/mp4"></video>
  <div class="grain"></div><div class="rangoli-bg"></div>
  <canvas id="confetti"></canvas>

  <div id="startStage" class="start-stage">
    <div>
      <p class="overline">PROJECTOR MODE</p>
      <h1>NAVRANG</h1>
      <p>Enable the stage for sound, animation and fullscreen.</p>
      <button id="startStageBtn" class="btn btn-primary btn-large">START STAGE <span>→</span></button>
    </div>
  </div>

  <main class="stage-shell">
    <header class="stage-top">
      <div class="stage-brand"><b>NAVRANG</b><span>NAVRATRI LIVE</span></div>
      <div class="stage-meta">
        <div class="meta-pill"><small>PLAYERS</small><b id="stagePlayers">0</b></div>
        <div class="meta-pill"><small>ROUND</small><b id="stageRound">LOBBY</b></div>
        <div class="meta-pill"><small>CODE</small><b id="stageCode">NAV26</b></div>
      </div>
    </header>
    <section class="stage-main">
      <div id="stageView" class="stage-view"></div>
    </section>
  </main>

  <div id="memoryOverlay" class="memory-overlay">
    <div style="text-align:center">
      <p class="overline">RANG PEHCHANO</p>
      <div id="memoryFlash" class="memory-flash"></div>
      <h2 style="margin-top:28px">Remember the order</h2>
    </div>
  </div>

  <div id="rhythmOverlay" class="rhythm-overlay">
    <div>
      <p class="overline">GARBA BEATS</p>
      <div id="rhythmIcon" class="rhythm-icon">🥁</div>
      <h2>Listen closely</h2>
      <p class="muted">Count the beats</p>
    </div>
  </div>

  <script src="../assets/common.js"></script>
  <script src="./stage.js"></script>
</body>
</html>
